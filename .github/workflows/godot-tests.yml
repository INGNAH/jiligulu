name: Godot regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  restaurant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
      - run: godot --headless --editor --path hotpot --import
      - name: Run restaurant test suites
        shell: bash
        run: |
          set -euo pipefail
          for suite in art layout session preparation shared_dining smoke ledger custom_orders recipe_research restaurant_night table_service tray_portions regression dishes patrons cooking staff; do
            echo "Running $suite"
            log="$(mktemp)"
            rc=0
            XDG_DATA_HOME="$(mktemp -d)" timeout 90 godot --headless --path hotpot --script "res://tests/$suite.gd" >"$log" 2>&1 || rc=$?
            cat "$log"
            if (( rc != 0 )) || grep -q '^SCRIPT ERROR:' "$log"; then
              detail=$(grep -E '^(SCRIPT ERROR:|ERROR:| +at:)' "$log" | tail -n 12 | tr '\n' ' ' || true)
              echo "::error title=$suite::$suite: exit $rc; $detail"
              exit "$(( rc == 0 ? 1 : rc ))"
            fi
          done
