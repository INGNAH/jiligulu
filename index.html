  text-align:left;
}
.history-item:hover{
  border-color:#b7cdf5;
  background:#f7fbff;
}
.history-item.active{
  border-color:#72a4f8;
  background:#edf5ff;
}

  width:24px;height:24px;
  border-radius:6px;
  display:flex;

  justify-content:center;

  color:#687386;
  font-size:10px;
}
.history-main{min-width:0;}
.history-name{

  font-size:11px;
  font-weight:650;

<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),stage=$('stage');let src=null,cw=1200,ch=1200,zoom=1,ox=0,oy=0,transparent=false,showRuler=false,drag=false,lx=0,ly=0,activeTool=null,selStart=null,pendingRect=null,eyeTarget=null,enhance=0,removeBg=0,fillMode='solid',fillImg=null,fillImageMode='cover',fillZoom=1,fillOx=0,fillOy=0,fillCropEditing=false,fillGradientType='linear',fillLinearDir='horizontal',fillStops=[{c:'#ffffff',p:0},{c:'#dbeafe',p:100}],fillStop=0,selectedStyle='none',styleStrength=70,quality=.85,ops=[],undoStack=[],redoStack=[],historyLabels=[],historyIndex=-1,initialState=null,cropMode=false,cropSnapshot=null,selectedRatio='原图';
const sizes=[['原图',0,0],['1:1',1,1],['4:3',4,3],['3:4',3,4],['16:9',16,9],['9:16',9,16]];
const quicks=[['replace','编辑图像'],['remove','去掉背景'],['erase','框选删除'],['text','文字替换']];
const styles=[['none','原图','s-min'],['c3d','C4D/3D风格','s-c3d'],['minimal','极简主义','s-min'],['memphis','孟菲斯','s-mem'],['pop','波普艺术','s-pop'],['modern','现代主义','s-modern'],['cn','中国风','s-cn'],['cyber','赛博朋克','s-cyber'],['vapor','怀旧蒸汽波','s-vapor'],['glitch','像素撕裂','s-glitch'],['shift','颜色偏移','s-shift'],['flicker','噪点闪烁','s-flicker'],['25d','2.5D','s-25d'],['acid','酸性风格','s-acid'],['pixel','像素风','s-pixel'],['max','极大主义','s-max'],['mix','混合材料+层叠视觉','s-mix'],['layer','夸张层次','s-layer'],['pastel','柔和迷幻色盘','s-pastel'],['ai','AI美学','s-ai']];
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t.t);t.t=setTimeout(()=>t.classList.remove('show'),1600)}function log(s){$('quickStatus').textContent=s}function clamp(v,a=0,b=255){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}function rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clamp(v)).toString(16).padStart(2,'0')).join('')}
function ratioValues(){
  if(selectedRatio==='原图'&&src)return[src.naturalWidth||src.width,src.naturalHeight||src.height];
  let r=sizes.find(x=>x[0]===selectedRatio)||sizes[1];return[r[1],r[2]]
}
function syncCanvasInputs(){if($('manualW'))$('manualW').value=Math.round(cw);if($('manualH'))$('manualH').value=Math.round(ch)}
function applyRatioFromWidth(doHistory=false){
  let [a,b]=ratioValues(),w=Math.max(1,+$('manualW').value||cw||1200),h;
  if(selectedRatio==='原图'&&src){let iw=src.naturalWidth||src.width,ih=src.naturalHeight||src.height;h=Math.max(1,Math.round(w*ih/iw))}
  else h=Math.max(1,Math.round(w*b/a));
  cw=w;ch=h;syncCanvasInputs();resizeStage();draw();if(doHistory&&src)push()
}
function renderSizes(){
  let r=$('sizeRow');r.innerHTML='';sizes.forEach(([n,a,b])=>{
    let x=document.createElement('button');x.className='chip'+(selectedRatio===n?' active':'');x.textContent=n;
    x.onclick=()=>{
      selectedRatio=n;
      if(n==='原图'&&src){let iw=src.naturalWidth||src.width,ih=src.naturalHeight||src.height;let w=Math.max(1,+$('manualW').value||iw);cw=w;ch=Math.max(1,Math.round(w*ih/iw));}
      else {let w=Math.max(1,+$('manualW').value||cw||1200);cw=w;ch=Math.max(1,Math.round(w*b/a));}
      // Changing output ratio changes only the canvas. The uploaded image keeps its own aspect ratio.
      zoom=1;ox=0;oy=0;syncCanvasInputs();renderSizes();resetBoardPan();resizeStage();draw();if(src)push();toast('画布比例：'+n)
    };r.appendChild(x)
  })
}

let selectedReplaceIndex=-1;
let replaceMoving=false;
let replaceMoveStart=null;
const replaceImageCache=new Map();

function getReplaceOp(){
  return selectedReplaceIndex>=0 && ops[selectedReplaceIndex]?.type==='replaceImage'
    ? ops[selectedReplaceIndex] : null
}
function hitReplaceOp(p,op){
  return !!op && p.x>=op.r.x && p.x<=op.r.x+op.r.w && p.y>=op.r.y && p.y<=op.r.y+op.r.h
}
function findReplaceOpIndex(p){
  for(let i=ops.length-1;i>=0;i--){
    const op=ops[i];
    if(op?.type==='replaceImage' && hitReplaceOp(p,op))return i
  }
  return -1
}
function getReplacementImage(dataUrl){
  if(!dataUrl)return null;
  let im=replaceImageCache.get(dataUrl);
  if(im)return im;
  im=new Image();
  im.onload=()=>draw();
  im.src=dataUrl;
  replaceImageCache.set(dataUrl,im);
  return im
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(blob)
  })
}
function loadReplacementBlob(blob){
  if(!blob || !blob.type?.startsWith('image/')){
    toast('请选择 PNG 或其他图片文件');return
  }
  const targetRect=getReplaceOp()?.r || pendingRect;
  if(!targetRect){
    toast('请先在图片上框选替换区域');return
  }
  blobToDataURL(blob).then(dataUrl=>{
    const im=new Image();
    im.onload=()=>{
      const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height;
      let op=getReplaceOp();

      if(op){
        const cx=op.r.x+op.r.w/2, cy=op.r.y+op.r.h/2;
        const boundW=op.r.w, boundH=op.r.h;
        const fit=Math.min(boundW/iw,boundH/ih);
        const bw=Math.max(1,iw*fit), bh=Math.max(1,ih*fit);
        op.dataUrl=dataUrl;op.baseW=bw;op.baseH=bh;op.scale=1;op.angle=op.angle||0;
        op.r={x:cx-bw/2,y:cy-bh/2,w:bw,h:bh};
      }else{
        const r=targetRect;
        const fit=Math.min(r.w/iw,r.h/ih);
        const bw=Math.max(1,iw*fit),bh=Math.max(1,ih*fit);
        const rr={x:r.x+(r.w-bw)/2,y:r.y+(r.h-bh)/2,w:bw,h:bh};
        ops.push({type:'replaceImage',dataUrl,r:rr,baseW:bw,baseH:bh,scale:1,angle:0});
        selectedReplaceIndex=ops.length-1;
        pendingRect=null;
      }

      replaceImageCache.set(dataUrl,im);
      const selected=getReplaceOp();
      if(selected)showSel(selected.r);
      draw();push();renderAdjust();
      
    };
    im.src=dataUrl
  }).catch(()=>toast('图片读取失败'))
}
async function pasteReplacementFromClipboard(){
  if(!pendingRect && !getReplaceOp()){
    toast('请先框选替换区域');return
  }
  if(!navigator.clipboard?.read){
    toast('请直接按 Ctrl+V / ⌘V 粘贴 PNG');return
  }
  try{
    const items=await navigator.clipboard.read();
    for(const item of items){
      const type=item.types.find(t=>t.startsWith('image/'));
      if(type){
        const blob=await item.getType(type);
        loadReplacementBlob(blob);return
      }
    }
    toast('剪贴板中没有图片')
  }catch(e){
    toast('请直接按 Ctrl+V / ⌘V 粘贴 PNG')
  }
}
function updateReplacementScale(value){
  const op=getReplaceOp();if(!op)return;
  const pct=Math.max(10,Math.min(400,+value||100));
  const scale=pct/100;
  const cx=op.r.x+op.r.w/2,cy=op.r.y+op.r.h/2;
  op.scale=scale;
  op.r.w=Math.max(1,(op.baseW||op.r.w)*scale);
  op.r.h=Math.max(1,(op.baseH||op.r.h)*scale);
  op.r.x=cx-op.r.w/2;op.r.y=cy-op.r.h/2;
  showSel(op.r);draw()
}
function updateReplacementAngle(value){
  const op=getReplaceOp();if(!op)return;
  op.angle=Math.max(-180,Math.min(180,+value||0));
  draw()
}
function deleteReplacement(){
  if(selectedReplaceIndex<0)return;
  ops.splice(selectedReplaceIndex,1);
  selectedReplaceIndex=-1;
  pendingRect=null;
  $('selection').style.display='none';
  draw();push();renderAdjust();
}
function renderReplacePanel(p){
  const op=getReplaceOp();

  p.innerHTML=`<h4>编辑图像</h4>
    ${pendingRect||op?`<div class="replace-actions">
      <button class="btn primary" id="replacePaste">粘贴 PNG</button>
      <button class="btn" id="replaceUploadBtn">电脑上传</button>
      <input id="replaceUploadInput" type="file" accept="image/*" hidden>
    </div>`:''}
    ${op?`
    <div class="slider" style="margin-top:10px">
      <span>大小</span>
      <input id="replaceScale" type="range" min="10" max="400" step="1" value="${Math.round((op.scale||1)*100)}">
      <span class="v" id="replaceScaleV">${Math.round((op.scale||1)*100)}%</span>
    </div>
    <div class="slider" style="margin-top:8px">
      <span>角度</span>
      <input id="replaceAngle" type="range" min="-180" max="180" step="1" value="${Math.round(op.angle||0)}">
      <span class="v" id="replaceAngleV">${Math.round(op.angle||0)}°</span>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn danger" id="replaceDelete">删除图片</button>
    </div>`:''}`;

  if(pendingRect||op){
    $('replacePaste').onclick=pasteReplacementFromClipboard;
    $('replaceUploadBtn').onclick=()=>$('replaceUploadInput').click();
    $('replaceUploadInput').onchange=e=>loadReplacementBlob(e.target.files?.[0]);
  }

  if(op){
    $('replaceScale').oninput=e=>{
      $('replaceScaleV').textContent=e.target.value+'%';
      updateReplacementScale(e.target.value)
    };
    $('replaceScale').onchange=()=>push();

    $('replaceAngle').oninput=e=>{
      $('replaceAngleV').textContent=e.target.value+'°';
      updateReplacementAngle(e.target.value)
    };
    $('replaceAngle').onchange=()=>push();

    $('replaceDelete').onclick=deleteReplacement
  }
  log('')
}
function renderQuick(){
  let r=$('quickRow');r.innerHTML='';
  quicks.forEach(([id,n])=>{
    let b=document.createElement('button');
    b.className='quick'+(activeTool===id?' active':'');
    b.textContent=n;
    b.onclick=()=>{
      if(cropMode)cancelCrop();
      if(id==='remove'){oneClickRemoveBackground();return}
      activeTool=id;
      if(id!=='replace'){
        selectedReplaceIndex=-1;
      }
      stage.classList.toggle('selecting',id==='erase'||id==='text'||id==='replace');
      renderQuick();renderAdjust();$('dragBtn').classList.remove('active');
      if(id==='erase'||id==='text')toast('请在图片上框选区域')
    };
    r.appendChild(b)
  })
}
function renderAdjust(){
  let p=$('adjustPanel');
  if(activeTool==='replace'){
    renderReplacePanel(p)
  }else if(activeTool==='remove'){
    p.innerHTML=`<h4>去掉背景</h4><div class="small">点击“去掉背景”即直接处理上传图片；只去掉背景透明度，不改变任何 RGB、色相和饱和度。</div>`;
    log('去掉背景为一键处理。')
  }else if(activeTool==='erase'){
    p.innerHTML=`<h4>框选删除</h4><div class="small">在图片上框选需要删除的内容。</div>`;
    log('')
  }else if(activeTool==='text'){
    renderTextPanel(p);log('先框选旧文字，再编辑替换文字。')
  }else{
    p.innerHTML='<div class="small">选择上方工具后，这里显示对应调整功能。</div>';log('')
  }
}
let textDraft={text:'新文字',mode:'solid',color:'#ffffff',stops:[{c:'#ffffff',p:0},{c:'#facc15',p:100}],stop:0,angle:35,deleteBg:false,fontSize:48,fontWeight:800,strokeEnabled:false,strokePosition:'outer',strokeWidth:2,strokeColor:'#111827',colorChosen:false};function renderTextPanel(p){

<input id="textValue" class="field" value="${textDraft.text}" placeholder="输入替换文字">

function updateQualityPreviews(){
  const cards=[...document.querySelectorAll('.quality-card')];
  if(!cards.length)return;
  cards.forEach(card=>{
    const q=+card.dataset.q||1;
    const target=card.querySelector('canvas');
    if(!target)return;
    const tc=target.getContext('2d');
    tc.clearRect(0,0,32,32);
    tc.fillStyle='#f4f7fb';tc.fillRect(0,0,32,32);
    if(!src || !canvas.width || !canvas.height){
      tc.strokeStyle='#cbd5e1';tc.strokeRect(.5,.5,31,31);
      return;
    }
    // 先把当前真实画布完整缩放到 1:1 预览，不改变构图比例。
    const base=document.createElement('canvas');
    base.width=64;base.height=64;
    const bc=base.getContext('2d');
    bc.fillStyle='#f4f7fb';bc.fillRect(0,0,64,64);
    const sc=Math.min(64/canvas.width,64/canvas.height);
    const dw=Math.max(1,canvas.width*sc), dh=Math.max(1,canvas.height*sc);
    const dx=(64-dw)/2,dy=(64-dh)/2;
    bc.imageSmoothingEnabled=true;bc.imageSmoothingQuality='high';
    bc.drawImage(canvas,dx,dy,dw,dh);

    // 用 webp 实际质量编码生成近似导出效果预览。
    if(q<1 && base.toDataURL){
      try{
        const im=new Image();
        im.onload=()=>{
          tc.clearRect(0,0,32,32);
          tc.imageSmoothingEnabled=true;
          tc.imageSmoothingQuality='high';
          tc.drawImage(im,0,0,32,32);
        };
        im.src=base.toDataURL('image/webp',q);
      }catch(e){
        tc.drawImage(base,0,0,32,32);
      }
    }else{
      tc.imageSmoothingEnabled=true;tc.imageSmoothingQuality='high';
      tc.drawImage(base,0,0,32,32);
    }
  });
}

async function smartBackgroundSegmentation(){
  if(!src){toast('请先上传图片');return}
  toast('正在分割背景…');

  const iw=src.naturalWidth||src.width, ih=src.naturalHeight||src.height;
  const work=document.createElement('canvas');
  const maxSide=1100;
  const scale=Math.min(1,maxSide/Math.max(iw,ih));
  work.width=Math.max(1,Math.round(iw*scale));
  work.height=Math.max(1,Math.round(ih*scale));

  const ctx=work.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(src,0,0,work.width,work.height);

  const im=ctx.getImageData(0,0,work.width,work.height);
  const d=im.data,w=work.width,h=work.height,total=w*h;

  // 背景颜色只从四周边缘估算，主体区域不参与。
  const samples=[];
  const step=Math.max(1,Math.floor(Math.min(w,h)/140));
  const add=(x,y)=>{
    const i=(y*w+x)*4;
    if(d[i+3]>20)samples.push([d[i],d[i+1],d[i+2]])
  };
  for(let x=0;x<w;x+=step){add(x,0);add(x,h-1)}
  for(let y=0;y<h;y+=step){add(0,y);add(w-1,y)}
  if(!samples.length){toast('未检测到可删除背景');return}

  const median=a=>{
    const v=a.slice().sort((a,b)=>a-b);
    return v[Math.floor(v.length/2)]
  };
  const bg=[
    median(samples.map(v=>v[0])),
    median(samples.map(v=>v[1])),
    median(samples.map(v=>v[2]))
  ];

  const distAt=p=>{
    const i=p*4,dr=d[i]-bg[0],dg=d[i+1]-bg[1],db=d[i+2]-bg[2];
    return Math.sqrt(dr*dr*.30+dg*dg*.59+db*db*.11)
  };

  // 前景候选：与背景差异明显的文字/图像/物体。
  const fg=new Uint8Array(total);
  for(let p=0;p<total;p++){
    if(d[p*4+3]>10 && distAt(p)>=36)fg[p]=1
  }

  // 严格保留前景外扩 2px 的安全区。
  const safeRadius=Math.max(1,Math.ceil(2*scale));
  const safe=new Uint8Array(total);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const p=y*w+x;
      if(!fg[p])continue;
      for(let yy=Math.max(0,y-safeRadius);yy<=Math.min(h-1,y+safeRadius);yy++){
        for(let xx=Math.max(0,x-safeRadius);xx<=Math.min(w-1,x+safeRadius);xx++){
          safe[yy*w+xx]=1
        }
      }
    }
  }

  // 只从图像外边缘向内连通删除背景，不穿过前景 2px 安全区。
  const bgMask=new Uint8Array(total),seen=new Uint8Array(total);
  const q=new Int32Array(total);
  let head=0,tail=0;
  const pushP=p=>{
    if(p<0||p>=total||seen[p])return;
    seen[p]=1;q[tail++]=p
  };
  for(let x=0;x<w;x++){pushP(x);pushP((h-1)*w+x)}
  for(let y=0;y<h;y++){pushP(y*w);pushP(y*w+w-1)}

  const tolerance=48;
  while(head<tail){
    const p=q[head++];
    if(safe[p])continue;
    if(distAt(p)>tolerance)continue;
    bgMask[p]=1;
    const x=p%w,y=(p/w)|0;
    if(x>0)pushP(p-1);
    if(x<w-1)pushP(p+1);
    if(y>0)pushP(p-w);
    if(y<h-1)pushP(p+w)
  }

  // 关键规则：只修改背景 Alpha，不改任何 RGB。
  for(let p=0;p<total;p++){
    if(bgMask[p]&&!safe[p]){
      d[p*4+3]=0
    }
  }

  ctx.putImageData(im,0,0);

  const finalC=document.createElement('canvas');
  finalC.width=iw;finalC.height=ih;
  const fc=finalC.getContext('2d');
  fc.imageSmoothingEnabled=true;
  fc.imageSmoothingQuality='high';
  fc.drawImage(work,0,0,iw,ih);

  const img=new Image();
  img.onload=()=>{
    src=img;
    draw();
    push();
    toast('背景已去掉：文字与物体边缘保留 2px，主体颜色完全不修改')
  };
  img.src=finalC.toDataURL('image/png')
}

async function canvasToBlobAsync(c,mime,q){
  return await new Promise(resolve=>c.toBlob(resolve,mime,q))
}

async function encodeWebpCompressed(sourceCanvas,targetQuality){
  // 先生成100%基准，再生成目标质量版本，用文件体积判断压缩是否真实发生。
  const full=await canvasToBlobAsync(sourceCanvas,'image/webp',1);
  let compressed=await canvasToBlobAsync(sourceCanvas,'image/webp',targetQuality);

  if(!compressed)return null;
  if(targetQuality>=.999)return compressed;

  // 某些浏览器/实现对 webp quality 参数响应较弱。
  // 若第一次目标质量结果与100%几乎一样，再进行一次像素级重采样后重新编码。
  // 这里不改变输出尺寸，只改变编码输入的采样复杂度，确保文件体积产生实际差异。
  if(full && compressed.size>=full.size*.98){
    const tmp=document.createElement('canvas');
    tmp.width=sourceCanvas.width;
    tmp.height=sourceCanvas.height;
    const t=tmp.getContext('2d');

    // 使用目标质量控制轻量平滑强度：质量越低，重采样作用越明显。
    const down=Math.max(.72,Math.min(.98,.72+targetQuality*.26));
    const dw=Math.max(1,Math.round(sourceCanvas.width*down));
    const dh=Math.max(1,Math.round(sourceCanvas.height*down));

    const small=document.createElement('canvas');
    small.width=dw;small.height=dh;
    const sc=small.getContext('2d');
    sc.imageSmoothingEnabled=true;
    sc.imageSmoothingQuality='high';
    sc.drawImage(sourceCanvas,0,0,dw,dh);

    t.imageSmoothingEnabled=true;
    t.imageSmoothingQuality='high';
    t.drawImage(small,0,0,sourceCanvas.width,sourceCanvas.height);

    const retry=await canvasToBlobAsync(tmp,'image/webp',targetQuality);
    if(retry && retry.size<compressed.size)compressed=retry
  }

  return compressed
}

async function exportImage(fmt){
  draw();
  const out=document.createElement('canvas');
  out.width=cw;out.height=ch;
  const o=out.getContext('2d');
  o.drawImage(canvas,0,0);

  const name='视觉工作台-'+Date.now();

  if(fmt==='svg'){
    const data=out.toDataURL('image/png');
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${cw}" height="${ch}" viewBox="0 0 ${cw} ${ch}"><image href="${data}" width="${cw}" height="${ch}"/></svg>`;
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    const a=document.createElement('a');
    a.href=url;a.download=name+'.svg';a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    return
  }

  let blob=null;

  if(fmt==='webp'){
    blob=await encodeWebpCompressed(out,quality);
    if(!blob){
      toast('当前浏览器无法导出 webp');
      return
    }
  }else if(fmt==='jpg'){
    blob=await canvasToBlobAsync(out,'image/jpeg',quality);
  }else{
    blob=await canvasToBlobAsync(out,'image/png');
  }

  if(!blob){
    toast('导出失败');
    return
  }

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name+'.'+fmt;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);

  if(fmt==='webp'||fmt==='jpg'){
    const kb=Math.max(1,Math.round(blob.size/1024));
    toast(`已按 ${Math.round(quality*100)}% 质量压缩导出 · ${kb} KB`)
  }else{
    toast('PNG 已按无损方式导出')
  }
}

stage.addEventListener('pointerdown',e=>{
  if(spaceDown){e.preventDefault();beginBoardPan(e);return}
  if(!src&&!fillCropEditing)return;
  let p=canvasPoint(e);

  if(eyeTarget){setPickedColor(sampleCanvas(p),eyeTarget);return}

  if(!fillCropEditing&&!cropMode&&activeTool==='replace'){
    let op=getReplaceOp();
    let idx=op&&hitReplaceOp(p,op)?selectedReplaceIndex:findReplaceOpIndex(p);

    if(idx>=0){
      selectedReplaceIndex=idx;
      pendingRect=null;
      op=getReplaceOp();
      showSel(op.r);
      renderAdjust();
      replaceMoving=true;
      replaceMoveStart={p,x:op.r.x,y:op.r.y};
      stage.setPointerCapture(e.pointerId);
      return
    }

    if(p.x<0 || p.x>cw || p.y<0 || p.y>ch)return;

    selectedReplaceIndex=-1;
    pendingRect=null;
    $('selection').style.display='none';
    selStart=p;
    stage.setPointerCapture(e.pointerId);
    renderAdjust();
    return
  }

  if(!fillCropEditing&&!cropMode&&(activeTool==='erase'||activeTool==='text')){
    selStart=p;stage.setPointerCapture(e.pointerId);return
  }

  drag=true;lx=e.clientX;ly=e.clientY;
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId)
});

stage.addEventListener('pointermove',e=>{
  if(boardPanDrag){
    boardPanX=boardPanBaseX+(e.clientX-boardPanStartX);
    boardPanY=boardPanBaseY+(e.clientY-boardPanStartY);
    applyBoardPan();return
  }

  if(replaceMoving){
    const op=getReplaceOp();if(!op)return;
    const p=canvasPoint(e);
    op.r.x=replaceMoveStart.x+(p.x-replaceMoveStart.p.x);
    op.r.y=replaceMoveStart.y+(p.y-replaceMoveStart.p.y);
    // 允许元素在画板内任意位置移动；超出画板部分仅裁掉，不改变背景。
    op.r.x=Math.min(cw-1,Math.max(1-op.r.w,op.r.x));
    op.r.y=Math.min(ch-1,Math.max(1-op.r.h,op.r.y));
    showSel(op.r);draw();return
  }

  if(selStart){
    showSel(selectionRect(selStart,canvasPoint(e)));return
  }

  if(!drag)return;
  let r=canvas.getBoundingClientRect(),
      dx=(e.clientX-lx)*cw/r.width,
      dy=(e.clientY-ly)*ch/r.height;
  if(fillCropEditing){fillOx+=dx;fillOy+=dy}else{ox+=dx;oy+=dy}
  lx=e.clientX;ly=e.clientY;draw()
});

stage.addEventListener('pointerup',e=>{
  if(boardPanDrag){
    boardPanDrag=false;canvasShell?.classList.remove('artboard-dragging');return
  }

  if(replaceMoving){
    replaceMoving=false;replaceMoveStart=null;
    const op=getReplaceOp();if(op)showSel(op.r);
    push();renderAdjust();return
  }

  if(selStart){
    let r=selectionRect(selStart,canvasPoint(e));
    selStart=null;

    if(activeTool==='replace'){
      const x1=Math.max(r.x,0),y1=Math.max(r.y,0);
      const x2=Math.min(r.x+r.w,cw),y2=Math.min(r.y+r.h,ch);
      r={x:x1,y:y1,w:Math.max(0,x2-x1),h:Math.max(0,y2-y1)}
    }

    if(r.w<5||r.h<5){$('selection').style.display='none';return}
    pendingRect=r;showSel(r);

    if(activeTool==='erase'){
      ops.push({type:'erase',r:{...r}});
      pendingRect=null;$('selection').style.display='none';
      draw();push();
    }else{
      renderAdjust()
    }
    return
  }

  if(drag){
    drag=false;stage.classList.remove('dragging');
    if(!fillCropEditing)push()
  }
});

stage.addEventListener('wheel',e=>{
  if(!src&&!fillCropEditing)return;
  if(activeTool==='replace' && getReplaceOp()){
    e.preventDefault();return
  }
  e.preventDefault();
  if(fillCropEditing){
    fillZoom=Math.max(.2,Math.min(5,fillZoom*(e.deltaY<0?1.06:.94)));draw();return
  }
  zoom=Math.max(.25,Math.min(4,zoom*(e.deltaY<0?1.06:.94)));
  draw();clearTimeout(stage.wt);stage.wt=setTimeout(push,180)
},{passive:false});

document.addEventListener('paste',e=>{
  if(activeTool!=='replace')return;
  if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
  const item=[...(e.clipboardData?.items||[])].find(i=>i.type?.startsWith('image/'));
  if(!item)return;
  e.preventDefault();
  const blob=item.getAsFile();
  if(blob)loadReplacementBlob(blob)
});

window.addEventListener('resize',()=>resizeStage(boardAutoCenter));document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){spaceDown=true;e.preventDefault()}});document.addEventListener('keyup',e=>{if(e.code==='Space')spaceDown=false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportImage(b.dataset.export));
renderSizes();renderQuick();renderAdjust();renderStyles();renderFillSwatches();renderFillStops();renderQuality();syncFill();resizeStage();draw();updateUndo();
</script>

































<script id="v38-layout-patch">
window.addEventListener('DOMContentLoaded',()=>{
  const upload=document.getElementById('uploadCard');
  const size=document.getElementById('uploadSizeSection');
  const fill=document.getElementById('fillCard');

  function mountChild(card,key,title){
    if(!upload||!card)return;
    let sub=document.getElementById('uploadChild_'+key);
    if(sub)return;

    sub=document.createElement('div');
    sub.className='upload-child';
    sub.id='uploadChild_'+key;

    const head=document.createElement('div');
    head.className='upload-child-head';
    head.innerHTML=`<div class="upload-child-title">${title}</div><button class="upload-child-toggle" type="button">收起</button>`;

    const body=document.createElement('div');
    body.className='upload-child-body';
    body.id='uploadChildBody_'+key;

    card.parentElement?.removeChild(card);
    body.appendChild(card);
    sub.appendChild(head);
    sub.appendChild(body);
    upload.appendChild(sub);

    const toggle=head.querySelector('.upload-child-toggle');
    toggle.onclick=()=>{
      body.classList.toggle('collapsed');
      toggle.textContent=body.classList.contains('collapsed')?'展开':'收起';
    };
  }

  mountChild(size,'size','输出尺寸');
  mountChild(fill,'fill','填充');

  const quick=document.getElementById('quickCard');
  const left=upload?.parentElement;
  if(left)[upload,quick].filter(Boolean).forEach(card=>left.appendChild(card));

  const editor=document.getElementById('editorCard');
  const shell=document.getElementById('canvasShell');
  const style=document.getElementById('styleCard');
  if(editor && shell && style){
    style.parentElement?.removeChild(style);
    shell.insertAdjacentElement('afterend',style);
  }

  const quality=document.getElementById('qualityCard');
  let history=document.getElementById('historyCard');
  if(!history){
    const ht=[...document.querySelectorAll('.card .title')].find(el=>el.textContent.trim()==='历史记录');
    history=ht?.closest('.card')||null;
    if(history && !history.id)history.id='historyCard';
  }
  if(quality && history){
    quality.parentElement?.removeChild(quality);
    history.insertAdjacentElement('beforebegin',quality);
  }

  const bgBtn=document.getElementById('removeBgBtn');
  if(bgBtn){bgBtn.textContent='去掉背景';bgBtn.onclick=smartBackgroundSegmentation}

  renderStyles();renderQuality();syncFill();renderGradientControls();resizeStage();
});
</script>


<script id="v40-history-init">
window.addEventListener('DOMContentLoaded',()=>{
  if(undoStack.length){
    historyIndex=Math.min(Math.max(0,historyIndex),undoStack.length-1);
    while(historyLabels.length<undoStack.length)historyLabels.push(`步骤 ${historyLabels.length+1}`);
  }
  renderHistory();
  updateUndo();
});
</script>
